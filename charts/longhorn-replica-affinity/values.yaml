nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/yama6a/longhorn-replica-affinity
  tag: ""                    # OPTIONAL: (string) empty uses the chart's appVersion, which the release pins to the matching image
  pullPolicy: IfNotPresent
imagePullSecrets: []

labelKey: longhorn-replica-affinity/enabled # OPTIONAL: (string) pod label that opts a workload in. The webhook's objectSelector gates on it
labelValue: "true"                          # OPTIONAL: (string) value of that label
weight: 30                                  # OPTIONAL: (int) 1-100, per volume a node holds, capped at 100. Keep below hand-written preferences that should win
skipRWX: false                              # OPTIONAL: (bool) true ignores RWX volumes instead of preferring the share-manager's node

shareManager:
  enabled: true # OPTIONAL: (bool) also place Longhorn's share-manager pods on a replica node. Adds a webhook entry scoped to them

longhornNamespace: longhorn-system
logLevel: info    # OPTIONAL: (string) a zap level, e.g. debug, which logs every skipped admission
metricsPort: 9100

tls:
  mode: self-signed # OPTIONAL: (string) self-signed or provided. See TLS in the README
  secretName: ""    # OPTIONAL: (string) provided mode: the Secret with tls.crt and tls.key. Empty uses <fullname>-tls
  certManager:
    enabled: false  # OPTIONAL: (bool) provided mode only. Renders an Issuer, a Certificate and the ca-injector annotation. Needs cert-manager
    issuerRef: {}   # OPTIONAL: (object) your own issuer, e.g. {name: my-issuer, kind: ClusterIssuer}. Empty uses the rendered self-signed one

webhook:
  replicas: 2
  port: 8443
  timeoutSeconds: 5
  failurePolicy: Ignore # OPTIONAL: (string) Ignore or Fail. Keep Ignore, so a down webhook never blocks scheduling
  excludedNamespaces: [kube-system, longhorn-system] # OPTIONAL: (list) never mutated. The release namespace is added automatically
  podAntiAffinity: true
  annotations: {}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []

reconciler:
  enabled: true           # OPTIONAL: (bool) moves data for pods a hard constraint keeps off it. See reconcile in the README
  intervalSeconds: 60
  dwell: 30m              # OPTIONAL: (duration) time off its data before anything moves. Longer than a rolling update or a drain
  maxBorrow: 1h           # OPTIONAL: (duration) restore dataLocality after this even if Longhorn has not dropped the surplus replica
  maxMoveBytes: 5368709120 # OPTIONAL: (int) bytes, actual size not provisioned. Larger volumes never move. 5368709120 is 5Gi
  moveShareManager: true  # OPTIONAL: (bool) delete a stranded share-manager so it lands on a replica node. Stalls NFS mounts for seconds. false only reports it
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []

serviceAccount:
  annotations: {}

priorityClassName: ""

podMonitor:
  enabled: false # OPTIONAL: (bool) needs the Prometheus operator CRDs
  interval: 60s
  labels: {}

resources:
  requests: {cpu: 10m, memory: 48Mi}
  limits: {memory: 128Mi}
