suite: toggles
release:
  name: lra
  namespace: lra
templates:
  - templates/deployment-reconciler.yaml
  - templates/deployment-webhook.yaml
  - templates/podmonitor.yaml
  - templates/webhookconfiguration.yaml
  - templates/service.yaml
tests:
  - it: reconciler off renders no reconciler deployment
    set:
      reconciler.enabled: false
    template: templates/deployment-reconciler.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: podMonitor on scrapes the metrics port of both deployments
    set:
      podMonitor.enabled: true
    template: templates/podmonitor.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: PodMonitor
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/name: longhorn-replica-affinity
            app.kubernetes.io/instance: lra
      - equal:
          path: spec.podMetricsEndpoints[0].port
          value: metrics

  - it: shareManager off leaves only the workload webhook
    set:
      shareManager.enabled: false
    template: templates/webhookconfiguration.yaml
    asserts:
      - lengthEqual:
          path: webhooks
          count: 1
      - equal:
          path: webhooks[0].name
          value: pods.longhorn-replica-affinity.io

  - it: fullnameOverride renames every object and the webhook service reference
    set:
      fullnameOverride: lra-custom
    asserts:
      - equal:
          path: metadata.name
          value: lra-custom-webhook
        template: templates/deployment-webhook.yaml
      - equal:
          path: metadata.name
          value: lra-custom-reconciler
        template: templates/deployment-reconciler.yaml
      - equal:
          path: metadata.name
          value: lra-custom-webhook
        template: templates/service.yaml
      - equal:
          path: webhooks[0].clientConfig.service.name
          value: lra-custom-webhook
        template: templates/webhookconfiguration.yaml
