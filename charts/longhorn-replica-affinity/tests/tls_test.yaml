suite: tls
release:
  name: lra
  namespace: lra
templates:
  - templates/certificate.yaml
  - templates/webhookconfiguration.yaml
  - templates/deployment-webhook.yaml
tests:
  - it: cert-manager mode renders a self-signed Issuer and a Certificate
    set:
      tls.mode: provided
      tls.certManager.enabled: true
    template: templates/certificate.yaml
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: Issuer
        documentIndex: 0
      - isKind:
          of: Certificate
        documentIndex: 1
      - equal:
          path: spec.secretName
          value: longhorn-replica-affinity-tls
        documentIndex: 1
      - equal:
          path: spec.dnsNames
          value:
            - longhorn-replica-affinity-webhook.lra.svc
            - longhorn-replica-affinity-webhook.lra.svc.cluster.local
        documentIndex: 1

  - it: cert-manager mode hands the caBundle to ca-injector
    set:
      tls.mode: provided
      tls.certManager.enabled: true
    template: templates/webhookconfiguration.yaml
    asserts:
      - equal:
          path: metadata.annotations["cert-manager.io/inject-ca-from"]
          value: lra/longhorn-replica-affinity-webhook

  - it: an own issuerRef replaces the rendered Issuer
    set:
      tls.mode: provided
      tls.certManager.enabled: true
      tls.certManager.issuerRef:
        name: x
        kind: ClusterIssuer
    template: templates/certificate.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Certificate
      - equal:
          path: spec.issuerRef
          value:
            name: x
            kind: ClusterIssuer

  - it: provided mode mounts the named secret
    set:
      tls.mode: provided
      tls.secretName: my-tls
    template: templates/deployment-webhook.yaml
    asserts:
      - equal:
          path: spec.template.spec.volumes[0].secret.secretName
          value: my-tls
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: tls
            mountPath: /tls
            readOnly: true

  - it: provided mode needs no self-signed bootstrap env
    set:
      tls.mode: provided
      tls.secretName: my-tls
    template: templates/deployment-webhook.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: LRA_TLS_SECRET
          any: true
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LRA_TLS_MODE
            value: provided
