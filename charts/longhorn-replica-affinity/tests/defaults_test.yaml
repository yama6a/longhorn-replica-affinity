suite: defaults
release:
  name: lra
  namespace: lra
templates:
  - templates/deployment-webhook.yaml
  - templates/deployment-reconciler.yaml
  - templates/webhookconfiguration.yaml
  - templates/certificate.yaml
  - templates/podmonitor.yaml
tests:
  - it: renders the webhook deployment
    template: templates/deployment-webhook.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: longhorn-replica-affinity-webhook
      - equal:
          path: spec.template.spec.containers[0].args
          value: [webhook]
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/yama6a/longhorn-replica-affinity:0.0.0

  - it: renders the reconciler deployment
    template: templates/deployment-reconciler.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: longhorn-replica-affinity-reconciler
      - equal:
          path: spec.template.spec.containers[0].args
          value: [reconcile]

  - it: renders both webhook entries
    template: templates/webhookconfiguration.yaml
    asserts:
      - isKind:
          of: MutatingWebhookConfiguration
      - lengthEqual:
          path: webhooks
          count: 2
      - equal:
          path: webhooks[0].name
          value: pods.longhorn-replica-affinity.io
      - equal:
          path: webhooks[1].name
          value: sharemanager.longhorn-replica-affinity.io

  - it: mints its own certificate, so cert-manager is not involved
    template: templates/certificate.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: leaves caBundle to the pod rather than to ca-injector
    template: templates/webhookconfiguration.yaml
    asserts:
      - notExists:
          path: metadata.annotations["cert-manager.io/inject-ca-from"]

  - it: renders no podmonitor
    template: templates/podmonitor.yaml
    asserts:
      - hasDocuments:
          count: 0
