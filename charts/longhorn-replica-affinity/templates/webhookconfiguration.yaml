{{- $selfSigned := eq .Values.tls.mode "self-signed" -}}
{{- $injectFrom := and (eq .Values.tls.mode "provided") .Values.tls.certManager.enabled -}}
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: {{ include "lra.fullname" . }}
  labels: {{- include "lra.labels" . | nindent 4 }}
  annotations:
    {{- if $injectFrom }}
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/{{ include "lra.webhookName" . }}
    {{- end }}
    {{- with .Values.webhook.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- if $selfSigned }}
  # The pod writes caBundle itself in self-signed mode. Argo CD also needs ignoreDifferences, see the README.
{{- end }}
webhooks:
  - name: pods.longhorn-replica-affinity.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: {{ .Values.webhook.failurePolicy }}
    timeoutSeconds: {{ .Values.webhook.timeoutSeconds }}
    reinvocationPolicy: Never
    clientConfig:
      service:
        name: {{ include "lra.webhookName" . }}
        namespace: {{ .Release.Namespace }}
        path: /mutate
        port: 443
    # pods without the opt-in label never reach the webhook, so a bug here cannot touch them
    objectSelector:
      matchLabels:
        {{ .Values.labelKey }}: {{ .Values.labelValue | quote }}
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            {{- range .Values.webhook.excludedNamespaces }}
            - {{ . | quote }}
            {{- end }}
            - {{ .Release.Namespace | quote }}
    rules:
      - operations: ["CREATE"]
        apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["pods"]
        scope: Namespaced
{{- if .Values.shareManager.enabled }}
  # A separate entry, not a hole in the namespace exclusion above: its objectSelector matches only
  # share-manager pods, so the rest of Longhorn never reaches the webhook.
  - name: sharemanager.longhorn-replica-affinity.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: {{ .Values.webhook.failurePolicy }}
    timeoutSeconds: {{ .Values.webhook.timeoutSeconds }}
    reinvocationPolicy: Never
    clientConfig:
      service:
        name: {{ include "lra.webhookName" . }}
        namespace: {{ .Release.Namespace }}
        path: /mutate
        port: 443
    objectSelector:
      matchLabels:
        longhorn.io/component: share-manager
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values: [{{ .Values.longhornNamespace | quote }}]
    rules:
      - operations: ["CREATE"]
        apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["pods"]
        scope: Namespaced
{{- end }}
