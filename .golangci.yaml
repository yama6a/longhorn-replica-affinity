version: "2"
linters:
  enable:
    - bodyclose
    - contextcheck
    - errorlint
    - gocritic
    - gosec
    - misspell
    - noctx
    - nolintlint
    - paralleltest
    - revive
    - unconvert
    - usestdlibvars
    - wrapcheck
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Table-driven config tests use t.Setenv, which forbids t.Parallel.
      - path: internal/config/
        linters:
          - paralleltest
formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports
  exclusions:
    generated: lax
