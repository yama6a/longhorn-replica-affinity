name: release

on:
  push:
    branches: [main]

# Serialised so two runs cannot tag the same version. A cancelled run here loses nothing:
# the next one recomputes the bump from every PR merged since the last release.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # create the GitHub release
  packages: write # or the image and chart push fails with permission_denied
  id-token: write # mints the OIDC token the attestation is signed with
  attestations: write # stores the attestation

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Every PR merged since the last release, not just the one that triggered this run.
      # A concurrency group queues only ONE pending run, so a burst of merges silently
      # cancels the runs in between; deriving the bump from the whole backlog means the
      # next run absorbs whatever was dropped instead of losing those releases.
      - name: Resolve bump since the last release
        id: bump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          latest=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // ""')
          if [ -n "$latest" ]; then
            range="${latest}..HEAD"
          else
            range="HEAD"
          fi

          labels=""
          for sha in $(git rev-list "$range"); do
            labels+=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}/pulls" \
              --jq '.[0].labels[]?.name' 2>/dev/null || true)$'\n'
          done

          # Strongest bump in the batch wins. skip-release only suppresses when nothing
          # else in the backlog asked for a release.
          kind=none
          for want in patch minor major; do
            grep -qx "$want" <<<"$labels" && kind=$want
          done

          echo "since ${latest:-<start>}: $(grep -c . <<<"$labels" || true) labels -> ${kind}"
          echo "latest=${latest:-v0.0.0}" >> "$GITHUB_OUTPUT"
          echo "kind=${kind}" >> "$GITHUB_OUTPUT"

      - name: Compute next version
        id: version
        if: steps.bump.outputs.kind != 'none'
        env:
          KIND: ${{ steps.bump.outputs.kind }}
          LATEST: ${{ steps.bump.outputs.latest }}
        run: |
          set -euo pipefail
          IFS=. read -r major minor patch <<<"${LATEST#v}"
          case "$KIND" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          next="v${major}.${minor}.${patch}"
          echo "${LATEST} + ${KIND} -> ${next}"
          echo "version=${next}" >> "$GITHUB_OUTPUT"

  # Builds, scans, attests and pushes the image, and creates the GitHub release for this version.
  image:
    needs: bump
    if: needs.bump.outputs.version != ''
    uses: yama6a/gha/.github/workflows/docker-build-release.yaml@v2
    with:
      dockerfile: .build/Dockerfile
      version: ${{ needs.bump.outputs.version }}

  # Same version as the image, packaged from the tree that produced it, so a chart can never point at an
  # image tag that was never built.
  chart:
    needs: [bump, image]
    if: needs.bump.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Package and push the Helm chart
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          VERSION: ${{ needs.bump.outputs.version }}
        run: |
          set -euo pipefail
          echo "${GH_TOKEN}" | helm registry login ghcr.io -u "${ACTOR}" --password-stdin
          helm package charts/longhorn-replica-affinity \
            --version "${VERSION#v}" --app-version "${VERSION}" --destination /tmp/chart
          helm push "/tmp/chart/longhorn-replica-affinity-${VERSION#v}.tgz" \
            "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts"
