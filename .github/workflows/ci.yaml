name: ci

on:
  pull_request:
    branches: [main]
    # labeled/unlabeled so the gate re-runs on a label change, not just on a push.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  # A run can only restore caches from its own branch or the DEFAULT branch, so without a
  # run on main nothing ever populates a cache a fresh PR branch can see, and every PR
  # pays the cold-cache cost. This also means main itself is verified, not just the PR.
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-label:
    name: release label
    # A push to main carries no PR labels; the gate belongs on the PR that precedes it.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Exactly one release label
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail
          picked=$(jq -r '.[]' <<<"$LABELS" | grep -x -E 'patch|minor|major|skip-release' || true)
          count=$(grep -c . <<<"$picked" || true)
          if [ "$count" -ne 1 ]; then
            echo "::error::${count} release labels (${picked//$'\n'/, }); need exactly one of patch, minor, major, skip-release"
            exit 1
          fi
          echo "release label: ${picked}"

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # A stale go.mod/go.sum still builds, so nothing else here would catch it.
      - name: go mod tidy is committed
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum \
            || { echo "::error::go.mod/go.sum are not tidy; run 'make tidy' and commit"; exit 1; }

      - name: Install golangci-lint
        run: curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b "$(go env GOPATH)/bin"

      # setup-go caches GOMODCACHE and GOCACHE; golangci-lint keeps its own analysis cache
      # elsewhere, and re-analysing every package from scratch is most of the lint time.
      - name: restore golangci-lint cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/golangci-lint
          key: golangci-${{ runner.os }}-${{ hashFiles('go.sum', '.golangci.yaml') }}
          restore-keys: golangci-${{ runner.os }}-

      # `run` does not enforce the formatters, so check them separately.
      - name: format
        run: golangci-lint fmt --diff

      - name: vet + lint
        run: |
          go vet ./...
          golangci-lint run ./... -c .golangci.yaml

      # -race is the point: the cert bootstrap and the informer-backed index are both read
      # concurrently with the admission path.
      - name: test
        run: go test ./... -race -count=1 -coverprofile=cover.out

      - name: coverage summary
        run: go tool cover -func=cover.out | tail -1

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

      # The image is a manifest list, so a compile error on the arch CI does not run on
      # would only surface at release time.
      - name: cross-compile both release targets
        run: |
          for arch in amd64 arm64; do
            echo "building linux/$arch"
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build ./...
          done

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: install kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar xz kubeconform && sudo mv kubeconform /usr/local/bin/

      # The chart ships at the same version as the image, so a chart that does not render
      # is a broken release. Every values combination is rendered, because a conditional
      # that only breaks under one of them is exactly what gets missed.
      - name: helm lint + template + kubeconform
        run: |
          set -euo pipefail
          helm lint charts/longhorn-replica-affinity
          schema='https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          cases=(
            "defaults|"
            "provided + cert-manager|--set tls.mode=provided --set tls.certManager.enabled=true"
            "provided + own issuer|--set tls.mode=provided --set tls.certManager.enabled=true --set tls.certManager.issuerRef.name=x --set tls.certManager.issuerRef.kind=ClusterIssuer"
            "provided + own secret|--set tls.mode=provided --set tls.secretName=my-tls"
            "reconciler off|--set reconciler.enabled=false"
            "podMonitor on|--set podMonitor.enabled=true"
            "share-manager off|--set shareManager.enabled=false"
            "fullnameOverride|--set fullnameOverride=lra-custom"
          )
          fail=0
          for c in "${cases[@]}"; do
            name="${c%%|*}"; args="${c#*|}"
            echo "::group::$name"
            # shellcheck disable=SC2086
            if ! out=$(helm template lra charts/longhorn-replica-affinity -n lra $args \
                         --api-versions monitoring.coreos.com/v1 2>&1); then
              echo "$out"; echo "::error::$name failed to render"; fail=1; echo "::endgroup::"; continue
            fi
            # An empty render passes kubeconform trivially, so assert it produced something.
            n=$(grep -c '^kind:' <<<"$out" || true)
            if [ "$n" -lt 5 ]; then
              echo "::error::$name rendered only $n resources"; fail=1
            fi
            kubeconform -strict -ignore-missing-schemas -summary \
              -schema-location default -schema-location "$schema" <<<"$out" || fail=1
            # Helm parses a large YAML integer as float64, so `| quote` alone renders
            # "5.36870912e+09" and the binary rejects it at startup. It renders and
            # conforms perfectly, so only checking the value itself catches it.
            if grep -nE '^\s+(-\s+\{?name:.*)?value: "[0-9]+\.[0-9]+e[+-][0-9]+"' <<<"$out"; then
              echo "::error::$name renders a float in scientific notation; pipe through int64"
              fail=1
            fi
            echo "::endgroup::"
          done
          exit $fail

  meta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: restore npm cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-renovate
      - name: yamllint
        run: pipx run yamllint -c .yamllint.yml .
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color
      # Renovate silently falls back to its defaults on a broken config.
      - name: Validate renovate config
        run: npx --yes --package renovate -- renovate-config-validator --strict
